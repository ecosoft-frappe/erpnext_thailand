thai-tax:
  - changed-files:
      - any-glob-to-any-file: erpnext_thailand/thai_tax/**

thai-billing:
  - changed-files:
      - any-glob-to-any-file: erpnext_thailand/thai_billing/**

thai-deposit:
  - changed-files:
      - any-glob-to-any-file: erpnext_thailand/thai_deposit/**

petty-cash:
  - changed-files:
      - any-glob-to-any-file: erpnext_thailand/petty_cash/**

customization:
  - changed-files:
      - any-glob-to-any-file:
          - erpnext_thailand/custom/**
          - erpnext_thailand/fixtures/**
