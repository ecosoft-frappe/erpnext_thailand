  - changed-files:
      - any-glob-to-any-file: erpnext_thailand/translations/**

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - erpnext_thailand/public/**
          - "**/*.js"

documentation:
  - changed-files:
      - any-glob-to-any-file: "*.md"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - .pre-commit-config.yaml
