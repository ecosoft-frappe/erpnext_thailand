name: Delete branch on PR close

on:
  pull_request:
    types: [closed]

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete head branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const protectedBranches = ["main", "master", "develop"];

            if (context.payload.pull_request.head.repo.fork) {
              core.info(`Head branch "${branch}" belongs to a fork, skipping.`);
              return;
            }
            if (protectedBranches.includes(branch)) {
              core.info(`"${branch}" is a protected branch, skipping.`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.info(`Deleted branch "${branch}".`);
            } catch (error) {
              core.warning(`Could not delete branch "${branch}": ${error.message}`);
            }
